name: Locked native and Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        fast_math: ["ON", "OFF"]
    env:
      SKBUILD_CMAKE_ARGS: -DSUPERANSAC_ENABLE_FAST_MATH=${{ matrix.fast_math }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.82.1
          locked: true
          cache: false
      - name: Configure native test variant
        run: pixi run --locked configure -- -DSUPERANSAC_ENABLE_FAST_MATH=${{ matrix.fast_math }}
      - name: Build and test native and installed Python modules
        run: pixi run --locked test
      - name: Plot synthetic validation
        run: pixi run --locked demo
      - name: Build wheel from source distribution
        run: pixi run --locked package
      - name: Verify packaged import away from the source tree
        run: |
          pixi run --locked python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
          mv build "$RUNNER_TEMP/superansac-build"
          pixi run --locked python -I -c "import pysuperansac; print(pysuperansac.__file__); assert hasattr(pysuperansac, 'estimateLine3D')"
          pixi run --locked python -m pytest -q tests/line3d
          mv "$RUNNER_TEMP/superansac-build" build
      - uses: actions/upload-artifact@v4
        with:
          name: line3d-${{ matrix.fast_math }}
          path: build/line3d.png
