name: 3D line synthetic tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        fast_math: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libboost-system-dev libopencv-dev
      - run: python -m pip install cmake pybind11 numpy pytest
      - run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DSUPERANSAC_ENABLE_FAST_MATH=${{ matrix.fast_math }}
          -Dpybind11_DIR=$(python -m pybind11 --cmakedir)
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - run: PYTHONPATH=build/python python -m pytest -q tests/line3d
      - run: PYTHONPATH=build/python python examples/example_line3d_fitting.py --seed 7 --outlier-ratio 0.6
