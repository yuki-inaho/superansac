[build-system]
# Pixi pins the complete toolchain; this also declares a standalone pip backend.
requires = [
  "scikit-build-core==0.11.6",
  "pybind11==3.0.1",
  "packaging==25.0",
  "pathspec==0.12.1",
]
build-backend = "scikit_build_core.build"

[project]
name = "pysuperansac"
version = "1.0"
description = "A RANSAC implementation for robust estimation."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Barath", email = "majti89@gmail.com" }]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/yuki-inaho/superansac"

[tool.scikit-build]
minimum-version = "0.11"
wheel.packages = []
build-dir = "build/wheel/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = ">=3.31,<4"
ninja.version = ">=1.13,<2"

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
SUPERANSAC_ENABLE_NATIVE_ARCH = "OFF"
CMAKE_INSTALL_RPATH_USE_LINK_PATH = "ON"
